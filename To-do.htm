
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative To-Do List</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
    font-size: 14px;
}

/* Task Statistics */

.stats {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.stat {
    flex: 1;
    background: #f3f4ff;
    padding: 13px 5px;
    text-align: center;
    border-radius: 10px;
}

.stat h3 {
    color: #667eea;
    font-size: 22px;
}

.stat p {
    font-size: 12px;
    color: #777;
    margin-top: 5px;
}

/* Input */

.input-box {
    display: flex;
    gap: 10px;
}

.input-box input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 2px solid #ddd;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
}

.input-box input:focus {
    border-color: #667eea;
}

.add-btn {
    padding: 12px 18px;
    border: none;
    background: #667eea;
    color: white;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn:hover {
    background: #5145cd;
}

/* Filters */

.filters {
    display: flex;
    gap: 8px;
    margin-top: 22px;
    margin-bottom: 15px;
}

.filters button {
    flex: 1;
    padding: 9px 5px;
    border: none;
    background: #f1f1f1;
    border-radius: 8px;
    cursor: pointer;
    color: #555;
}

.filters button.active {
    background: #667eea;
    color: white;
}

/* Task List */

ul {
    list-style: none;
    max-height: 320px;
    overflow-y: auto;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8f8fc;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-left: 4px solid #667eea;
    animation: appear 0.3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Checkbox */

.task-check {
    width: 19px;
    height: 19px;
    cursor: pointer;
    accent-color: #667eea;
    flex-shrink: 0;
}

.task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    color: #333;
    font-size: 14px;
}

.completed .task-text {
    text-decoration: line-through;
    color: #aaa;
}

/* Buttons */

.actions {
    display: flex;
    gap: 5px;
}

.actions button {
    border: none;
    padding: 7px 9px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

.edit-btn {
    background: #f5a623;
}

.delete-btn {
    background: #ef5350;
}

.actions button:hover {
    opacity: 0.8;
}

/* Empty Message */

.empty {
    text-align: center;
    color: #aaa;
    padding: 30px 10px;
    font-size: 14px;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #999;
}

@media(max-width: 400px) {
    .container {
        padding: 20px;
    }

    .actions button {
        padding: 7px;
    }

    .input-box {
        gap: 6px;
    }

    .add-btn {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📝 My To-Do List</h1>
    <p class="subtitle">Organize your day, achieve your goals!</p>

    <!-- Statistics -->

    <div class="stats">
        <div class="stat">
            <h3 id="total">0</h3>
            <p>Total</p>
        </div>

        <div class="stat">
            <h3 id="pending">0</h3>
            <p>Pending</p>
        </div>

        <div class="stat">
            <h3 id="completed">0</h3>
            <p>Completed</p>
        </div>
    </div>

    <!-- Input -->

    <div class="input-box">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
            maxlength="150"
        >
        <button class="add-btn" id="addBtn" onclick="addTask()">
            + Add
        </button>
    </div>

    <!-- Filters -->

    <div class="filters">
        <button class="active" onclick="filterTasks('all', this)">All</button>
        <button onclick="filterTasks('pending', this)">Pending</button>
        <button onclick="filterTasks('completed', this)">Completed</button>
    </div>

    <!-- Task List -->

    <ul id="taskList"></ul>

    <div class="footer">
        ✨ Stay focused and make every day count!
    </div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
let currentFilter = "all";
let editingId = null;

const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");
const addBtn = document.getElementById("addBtn");

// Save tasks

function saveTasks() {
    localStorage.setItem("myTasks", JSON.stringify(tasks));
}

// Add or Update Task

function addTask() {

    const text = taskInput.value.trim();

    if (text === "") {
        alert("Please enter a task!");
        return;
    }

    if (editingId !== null) {

        const task = tasks.find(t => t.id === editingId);
        task.text = text;

        editingId = null;
        addBtn.textContent = "+ Add";

    } else {

        tasks.push({
            id: Date.now(),
            text: text,
            completed: false
        });

    }

    taskInput.value = "";

    saveTasks();
    renderTasks();
}

// Edit Task

function editTask(id) {

    const task = tasks.find(t => t.id === id);

    if (task.completed) {
        alert("Completed tasks cannot be edited.");
        return;
    }

    taskInput.value = task.text;
    editingId = id;

    addBtn.textContent = "Update";

    taskInput.focus();
}

// Complete / Uncomplete Task

function toggleTask(id) {

    const task = tasks.find(t => t.id === id);

    task.completed = !task.completed;

    saveTasks();
    renderTasks();
}

// Delete Task

function deleteTask(id) {

    if (!confirm("Are you sure you want to delete this task?")) {
        return;
    }

    tasks = tasks.filter(t => t.id !== id);

    if (editingId === id) {
        editingId = null;
        taskInput.value = "";
        addBtn.textContent = "+ Add";
    }

    saveTasks();
    renderTasks();
}

// Filter Tasks

function filterTasks(filter, button) {

    currentFilter = filter;

    document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    renderTasks();
}

// Render Tasks

function renderTasks() {

    taskList.innerHTML = "";

    let filteredTasks = tasks.filter(task => {

        if (currentFilter === "pending") {
            return !task.completed;
        }

        if (currentFilter === "completed") {
            return task.completed;
        }

        return true;
    });

    if (filteredTasks.length === 0) {

        const empty = document.createElement("div");
        empty.className = "empty";

        empty.textContent = tasks.length === 0
            ? "🌟 No tasks yet. Add your first task!"
            : "No tasks found in this category.";

        taskList.appendChild(empty);
    }

    filteredTasks.forEach(task => {

        const li = document.createElement("li");

        if (task.completed) {
            li.classList.add("completed");
        }

        // Checkbox

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.completed;

        checkbox.addEventListener("change", () => {
            toggleTask(task.id);
        });

        // Task Text

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        // Action Buttons

        const actions = document.createElement("div");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.textContent = "✏️";
        edit.title = "Edit task";

        edit.addEventListener("click", () => {
            editTask(task.id);
        });

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "🗑️";
        del.title = "Delete task";

        del.addEventListener("click", () => {
            deleteTask(task.id);
        });

        actions.append(edit, del);

        li.append(checkbox, span, actions);

        taskList.appendChild(li);

    });

    // Update Statistics

    document.getElementById("total").textContent = tasks.length;

    document.getElementById("completed").textContent =
        tasks.filter(t => t.completed).length;

    document.getElementById("pending").textContent =
        tasks.filter(t => !t.completed).length;

}

// Enter key support

taskInput.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        addTask();
    }

});

// Initial Display

renderTasks();

</script>

</body>
</html>
